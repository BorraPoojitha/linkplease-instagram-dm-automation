services:
  - type: web
    name: linkplease-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString
      - key: MAX_RETRIES
        value: "5"
      - key: WORKER_POLL_INTERVAL
        value: "1.0"
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60.0"

databases:
  - name: linkplease-db
    databaseName: linkplease
    user: linkplease_user
